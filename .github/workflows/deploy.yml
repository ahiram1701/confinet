name: Deploy (Cloudflare)

# push a main  → staging    (API: confinet-api-staging · PWA: https://main.confinet.pages.dev)
# tag v*       → producción (API: confinet-api-production · PWA: https://confinet.pages.dev)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Desactivado hasta configurar Cloudflare: crea la variable de repositorio
    # CLOUDFLARE_ENABLED=true (Settings → Secrets and variables → Actions → Variables).
    if: vars.CLOUDFLARE_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Los "environments" de GitHub guardan los secretos de cada entorno; en "production"
    # puedes exigir aprobación manual (Settings → Environments → Required reviewers).
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    env:
      TARGET: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Migraciones D1
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply "confinet-$TARGET" --remote --env "$TARGET"

      - name: Secretos del Worker
        working-directory: apps/api
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          FACTCHECK_API_KEY: ${{ secrets.FACTCHECK_API_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          # Solo se suben los secretos definidos (los vacíos se omiten).
          jq -n 'env | with_entries(select(.key | IN(
            "BETTER_AUTH_SECRET","ENCRYPTION_KEY","GOOGLE_CLIENT_ID","GOOGLE_CLIENT_SECRET",
            "GITHUB_CLIENT_ID","GITHUB_CLIENT_SECRET","LLM_API_KEY","GROQ_API_KEY","OLLAMA_API_KEY",
            "CLOUDFLARE_AI_TOKEN","FACTCHECK_API_KEY","ADMIN_EMAILS")) | select(.value != ""))
            + {CLOUDFLARE_ACCOUNT_ID: env.CLOUDFLARE_ACCOUNT_ID}' > secrets.json
          pnpm exec wrangler secret bulk secrets.json --env "$TARGET"
          rm secrets.json

      - name: Desplegar API (Worker)
        working-directory: apps/api
        run: pnpm exec wrangler deploy --env "$TARGET"

      - name: Compilar PWA
        run: pnpm --filter @confinet/web build

      - name: Desplegar PWA (Pages)
        working-directory: apps/web
        # La rama "production" es la de producción en Pages; "main" queda como preview (staging).
        run: pnpm exec wrangler pages deploy dist --project-name confinet --branch "${{ env.TARGET == 'production' && 'production' || 'main' }}"

      - name: Comprobar salud
        run: |
          URL="${{ env.TARGET == 'production' && 'https://confinet.pages.dev' || 'https://main.confinet.pages.dev' }}"
          for i in 1 2 3 4 5; do
            curl -fsS "$URL/api/health" && exit 0
            sleep 10
          done
          exit 1
