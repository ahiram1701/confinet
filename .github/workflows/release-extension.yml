name: Publicar extensión

# Cada cambio que afecta a la extensión y llega a main publica una versión nueva sola:
# versión = último tag ext-v* + 1 en el parche (o la de apps/extension/package.json si es mayor).
# También se puede lanzar a mano o con un tag ext-vX.Y.Z.
on:
  push:
    branches: [main]
    paths:
      - 'apps/extension/**'
      - '!apps/extension/e2e/**'
      - '!apps/extension/**/*.test.ts'
      - '!apps/extension/playwright.config.ts'
      - 'packages/core/**'
      - 'packages/extract/**'
      - 'packages/ui/**'
      - '.github/workflows/release-extension.yml'
    tags: ['ext-v*']
  workflow_dispatch:

permissions:
  contents: write # para crear el tag y el GitHub Release

concurrency:
  group: release-extension
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    env:
      # Versión sin servidor (GitHub Pages). Con Cloudflare: WXT_BACKEND=api y la URL de Pages.
      WXT_BACKEND: static
      WXT_APP_URL: https://ahiram1701.github.io/confinet
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # necesitamos los tags para calcular la versión
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Calcular versión
        id: version
        run: |
          PKG=$(node -p "require('./apps/extension/package.json').version")
          LAST=$(git tag -l 'ext-v*' --sort=-v:refname | head -1 | sed 's/^ext-v//')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#ext-v}"
          elif [ -z "$LAST" ]; then
            VERSION="$PKG"
          else
            NEXT=$(echo "$LAST" | awk -F. '{ print $1 "." $2 "." $3 + 1 }')
            VERSION=$(printf '%s\n%s\n' "$NEXT" "$PKG" | sort -V | tail -1)
          fi
          echo "Versión: $VERSION (último tag: ${LAST:-ninguno}, package.json: $PKG)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compilar y empaquetar
        env:
          WXT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          pnpm --filter @confinet/extension zip
          mkdir -p dist-ext
          mv apps/extension/.output/*-chrome.zip "dist-ext/confinet-extension-$WXT_VERSION-chrome.zip"

      - name: GitHub Release (descarga gratuita para Chrome/Brave/Edge en modo desarrollador)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ext-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Extensión ${{ steps.version.outputs.version }}
          files: dist-ext/*.zip
          generate_release_notes: true
          make_latest: true

      # Edge Add-ons: registro de desarrollador gratuito. Con la extensión en la tienda, el
      # navegador de cada usuario la actualiza solo.
      - name: Publicar en Edge Add-ons
        if: vars.EDGE_ENABLED == 'true'
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: bash scripts/publish-edge.sh dist-ext/*.zip

      # Chrome Web Store: requiere pagar 5 USD (una vez) por la cuenta de desarrollador.
      # Desactivado por defecto; actívalo con la variable CWS_ENABLED=true.
      - name: Publicar en Chrome Web Store
        if: vars.CWS_ENABLED == 'true'
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          npx --yes chrome-webstore-upload-cli@3 upload \
            --source dist-ext/*.zip --auto-publish
