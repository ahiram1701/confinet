name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formato
        run: pnpm format:check
      - name: Lint + typecheck + tests + build
        run: pnpm turbo run lint typecheck test build
      - name: Build sin servidor (GitHub Pages)
        run: pnpm --filter @confinet/web build:static
      - name: Empaquetar extensión (modo sin servidor)
        env:
          WXT_BACKEND: static
          WXT_APP_URL: https://ahiram1701.github.io/confinet
        run: pnpm --filter @confinet/extension zip
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: apps/extension/.output/*.zip
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 14

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @confinet/web exec playwright install --with-deps chromium
      - name: Secretos locales de prueba
        run: |
          {
            echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)"
            echo "ENCRYPTION_KEY=$(openssl rand -base64 32)"
          } > apps/api/.dev.vars
      - name: E2E con API (Workers local, IA simulada)
        run: pnpm --filter @confinet/web e2e
      - name: E2E sin servidor (GitHub Pages)
        run: pnpm --filter @confinet/web e2e:static
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/playwright-report-static
          retention-days: 7
